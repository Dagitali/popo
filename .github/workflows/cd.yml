# popo
#
# Copyright © 2026 Dagitali LLC. All rights reserved.
#
# GitHub Actions workflow for continuous delivery of tagged Python packages.
#
# Responsibilities
# - Validate an existing annotated version tag on the default branch history.
# - Build once, test both distributions, and attach checksums and a runtime SBOM.
# - Optionally create a GitHub Release from those validated artifacts.
#
# Maintainer Notes
# - Tag pushes validate only. Publishing requires manual opt-in from the default
#   branch, ENABLE_RELEASE_PUBLISHING=true, and the release environment.
# - Configure required reviewers on that environment before enabling publishing.
# - Publication does not create tags, replace releases, or publish to PyPI.
# - Historical releases are never marked latest automatically.
# - Only the publication job has contents:write; no tagged code runs in that job.
#
# References
# - GitHub release CLI:
#   https://cli.github.com/manual/gh_release_create
# - CycloneDX Python tooling:
#   https://cyclonedx-bom-tool.readthedocs.io/en/latest/usage.html

---
name: Continuous Delivery (CD)

run-name: 'CD: validate ${{ inputs.release_tag || github.ref_name }}'

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing annotated vMAJOR.MINOR.PATCH tag
        required: true
        type: string
      publish:
        description: Publish a new GitHub Release after successful validation
        type: boolean
        default: false

permissions: {}

env:
  DEFAULT_PYTHON_VERSION: '3.13'
  CYCLONEDX_BOM_VERSION: '7.2.2'
  ARTIFACT_RETENTION_DAYS: '14'
  RELEASE_ARTIFACT_NAME: release-artifacts
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

concurrency:
  group: ${{ github.workflow }}-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      tag_object: ${{ steps.tag.outputs.tag_object }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # Pinned v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify and select annotated release tag
        id: tag
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Release tag must use vMAJOR.MINOR.PATCH' >&2
            exit 1
          fi
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          tagged_commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor "$tagged_commit" "refs/remotes/origin/$DEFAULT_BRANCH"
          echo "tag_object=$(git rev-parse "refs/tags/$RELEASE_TAG")" >> "$GITHUB_OUTPUT"
          git checkout --detach "$tagged_commit"

      - name: Set up project
        uses: ./.github/actions/setup-python-project
        with:
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}
          extras: dev

      - name: Verify changelog and source
        run: |
          python -m popo check-release-changelog "$RELEASE_TAG"
          make check PYTHON=python

      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*
          python -m pytest tests/meta tests/e2e --artifact-dir dist

      - name: Verify built version matches tag
        run: |
          python - <<'PY'
          import os
          import tomllib
          from email.parser import BytesParser
          from pathlib import Path
          from zipfile import ZipFile
          wheels = list(Path('dist').glob('*.whl'))
          assert len(wheels) == 1
          with ZipFile(wheels[0]) as wheel:
              metadata = BytesParser().parsebytes(wheel.read(next(
                  name for name in wheel.namelist() if name.endswith('/METADATA')
              )))
          project = tomllib.loads(Path('pyproject.toml').read_text())['project']
          assert metadata['Name'] == project['name']
          assert metadata['Version'] == os.environ['RELEASE_TAG'][1:]
          PY

      - name: Generate and validate release SBOM
        run: |
          python -m venv "$RUNNER_TEMP/release-runtime"
          "$RUNNER_TEMP/release-runtime/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/release-runtime/bin/python" -m pip check
          python -m venv "$RUNNER_TEMP/release-tools"
          "$RUNNER_TEMP/release-tools/bin/python" -m pip install "cyclonedx-bom==$CYCLONEDX_BOM_VERSION"
          "$RUNNER_TEMP/release-tools/bin/python" -m cyclonedx_py environment \
            "$RUNNER_TEMP/release-runtime/bin/python" --output-format JSON \
            --validate --output-file dist/python-sbom.json

      - name: Generate checksums
        working-directory: dist
        run: sha256sum -- ./*.tar.gz ./*.whl ./python-sbom.json > SHA256SUMS

      - name: Upload validated artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # Pinned v7.0.1
        with:
          name: ${{ env.RELEASE_ARTIFACT_NAME }}
          path: |
            dist/*.tar.gz
            dist/*.whl
            dist/python-sbom.json
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  release:
    name: Publish GitHub release
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.publish &&
      vars.ENABLE_RELEASE_PUBLISHING == 'true' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download validated artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # Pinned v8.0.1
        with:
          name: ${{ env.RELEASE_ARTIFACT_NAME }}
          path: dist

      - name: Verify tag and publish without replacing an existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_TAG_OBJECT: ${{ needs.build.outputs.tag_object }}
        run: |
          set -euo pipefail
          current_tag="$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          test "$current_tag" = "$EXPECTED_TAG_OBJECT"
          (cd dist && sha256sum --check SHA256SUMS)
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes --latest=false \
            dist/*.whl dist/*.tar.gz dist/python-sbom.json dist/SHA256SUMS
