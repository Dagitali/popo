#
# One explicit consumer-owned profile for local and CI guardrails.

[profiles.guardrails]
checks = [
  "check-docs",
  "check-required-files",
  "check-github-actions-pins",
  "check-dependency-boundaries",
  "check-python-policy",
  "check-guardrail-parity",
]

[files]
required = [
  "README.md",
  "Makefile",
  ".pre-commit-config.yaml",
  ".github/workflows/ci.yml",
  "requirements-guardrails.txt",
  "pyproject.toml",
  ".python-version",
  "app.py",
  "tests/test_app.py",
  "cdk.json",
  "requirements.txt",
]

[dependencies]
metadata = "pyproject.toml"
requirements = "requirements.txt"
mode = "exact"

[python-policy]
# Defaults follow package metadata, .python-version and the declared tool policy.

[guardrails]
# Defaults inspect the guardrails Make target/profile/job and popo hook/step.
