#
# Consumer application metadata and declared Python tool policy.

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "python-guardrail-example"
version = "0.1.0"
requires-python = ">=3.13,<3.15"
dependencies = ["packaging>=26.3,<27"]

[tool.mypy]
python_version = "3.13"

[tool.ruff]
target-version = "py313"

[tool.ruff.format]
quote-style = "single"

[tool.setuptools.packages.find]
where = ["src"]
