# pyproject.toml
# popo
#
# Copyright © 2026 Dagitali LLC. All rights reserved.
#
# Python project configuration and canonical package metadata.
#
# Responsibilities
# - Define build-system requirements and setuptools backend configuration.
# - Declare canonical package metadata, runtime dependencies, optional extras,
#   command-line entry points, and package data.
# - Configure Python tooling that reads project settings from pyproject.toml.
#
# Maintainer Notes
# - Treat this file as the canonical source for packaging metadata.
# - Derive package versions from annotated Git release tags through
#   setuptools-scm; do not add a second version source.
# - Keep consumer repository policy separate from this project's own checks.
# - Keep distribution tests opt-in and coverage reporting independent of a
#   consumer's chosen coverage threshold.
#
# References
# - setuptools pyproject configuration:
#   https://setuptools.pypa.io/en/latest/userguide/pyproject_config.html
# - pyproject.toml specification:
#   https://packaging.python.org/en/latest/specifications/pyproject-toml/
# - PEP 621 project metadata:
#   https://peps.python.org/pep-0621/

[build-system]
# Use a modern setuptools that supports PEP 621 & editable installs (PEP 660).
requires = ["setuptools>=80", "setuptools-scm>=9.2,<11", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "popo"
dynamic = ["version"]
description = "Reusable repository policy and consistency checks"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.13,<3.15"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [
  {name = "Dagitali LLC"},
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
# Runtime dependencies support the CLI; optional groups contain contributor tools.
dependencies = [
  "packaging>=26.3,<27",
]

[project.optional-dependencies]
# Development-only tools (install with: pip install -e '.[dev]')
dev = [
  "build>=1.3,<2",
  "mypy>=2.0,<3",
  "pre-commit>=4.0,<5",
  "pytest>=9.0,<10",
  "pytest-cov>=7.0,<8",
  "PyYAML>=6,<7",
  "ruff>=0.16,<0.17",
  "twine>=6.2,<8",
]

[project.scripts]
# Keep the installed command aligned with the public CLI entry point.
popo = "popo.cli:main"

[project.urls]
Changelog = "https://github.com/Dagitali/popo/blob/main/CHANGELOG.md"
Documentation = "https://github.com/Dagitali/popo/tree/main/docs"
Homepage = "https://github.com/Dagitali/popo"
Issues = "https://github.com/Dagitali/popo/issues"
Repository = "https://github.com/Dagitali/popo"

[tool.popo.dependencies]
# These settings check this repository, not repositories consuming the CLI.
metadata = "pyproject.toml"
requirements = "requirements/lowest.txt"
mode = "minimum-constraints"

[tool.popo.python-policy]
metadata = "pyproject.toml"
requires-python = ">=3.13,<3.15"
python-version = "3.13"
python-version-file = ".python-version"
ruff-config = "pyproject.toml"
ruff-target-version = "py313"
mypy-python-version = "3.13"
workflow-directory = ".github/workflows"

[tool.coverage.run]
branch = true
source = ["popo"]

[tool.coverage.report]
show_missing = true
skip_covered = true
skip_empty = true

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["popo"]
mypy_path = "src"

[tool.pytest]
minversion = "9.0"
addopts = [
  "-ra",
  "--import-mode=importlib",
  "--strict-config",
  "--strict-markers",
]
testpaths = ["tests/unit", "tests/integration"]
# Source tests do not depend on an editable-install .pth file being processed.
pythonpath = ["src"]
# Distribution tests build artifacts and may install dependencies from the network.
# Select tests/meta and tests/e2e explicitly; support contains only shared fixtures.
norecursedirs = ["support"]
markers = [
  "unit: isolated checker and automation contracts",
  "integration: interactions across CLI and checker boundaries",
  "meta: package artifact and metadata contracts",
  "e2e: installed package workflows through the public CLI",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.format]
quote-style = "single"
nested-string-quote-style = "preferred"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP", "W"]

[tool.setuptools.package-data]
popo = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]
# Include the public namespace without capturing unrelated sibling packages.
include = ["popo", "popo.*"]

[tool.setuptools_scm]
fallback_version = "0.0.0"
parentdir_prefix_version = "popo-"
